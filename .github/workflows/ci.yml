name: CI

# docs/17 §4. Every push runs the checks; only `main` deploys, and only when the
# Cloudflare credentials exist (docs/17 §6), so CI stays green without them.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the history

      - uses: pnpm/action-setup@v4 # version from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm security
      - run: pnpm build
      - run: pnpm size
      - run: pnpm lhci
      - run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Deploy skipped: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set (docs/17 §2, §6)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.creds.outputs.ready == 'true'
      - run: pnpm build
        if: steps.creds.outputs.ready == 'true'

      # Order matters: migrations first, then the code (docs/17 §3).
      - name: Apply D1 migrations
        if: steps.creds.outputs.ready == 'true'
        run: pnpm exec wrangler d1 migrations apply quick-robot-web --remote
      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: pnpm run deploy
